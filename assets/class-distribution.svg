<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Class distribution after dataset cleaning</title>
  <desc id="desc">Horizontal bars show 197 Angry, 185 Fear, 167 Happy, and 204 Sad drawings, totaling 753.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171715; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle, .axis { font-size: 14px; fill: #4d4b46; }
    .label { font-size: 15px; font-weight: 600; }
    .value { font-size: 14px; font-weight: 700; }
    .grid { stroke: #bcb5a9; stroke-width: 1; }
    .track { fill: #ddd6ca; }
  </style>
  <text class="title" x="40" y="42">Cleaned labeled dataset</text>
  <text class="subtitle" x="40" y="68">753 unique drawings after duplicate and label-conflict removal</text>
  <line class="grid" x1="130" y1="88" x2="130" y2="350"/><text class="axis" x="130" y="380" text-anchor="middle">0</text>
  <line class="grid" x1="286.8" y1="88" x2="286.8" y2="350"/><text class="axis" x="286.8" y="380" text-anchor="middle">50</text>
  <line class="grid" x1="443.6" y1="88" x2="443.6" y2="350"/><text class="axis" x="443.6" y="380" text-anchor="middle">100</text>
  <line class="grid" x1="600.5" y1="88" x2="600.5" y2="350"/><text class="axis" x="600.5" y="380" text-anchor="middle">150</text>
  <line class="grid" x1="757.3" y1="88" x2="757.3" y2="350"/><text class="axis" x="757.3" y="380" text-anchor="middle">200</text>
  <text class="label" x="114" y="129" text-anchor="end">Angry</text><rect class="track" x="130" y="105" width="690" height="34" rx="6"/><rect x="130" y="105" width="617.9" height="34" rx="6" fill="#b45309"/><text class="value" x="757.9" y="128">197</text>
  <text class="label" x="114" y="191" text-anchor="end">Fear</text><rect class="track" x="130" y="167" width="690" height="34" rx="6"/><rect x="130" y="167" width="580.2" height="34" rx="6" fill="#6d28d9"/><text class="value" x="720.2" y="190">185</text>
  <text class="label" x="114" y="253" text-anchor="end">Happy</text><rect class="track" x="130" y="229" width="690" height="34" rx="6"/><rect x="130" y="229" width="523.8" height="34" rx="6" fill="#15803d"/><text class="value" x="663.8" y="252">167</text>
  <text class="label" x="114" y="315" text-anchor="end">Sad</text><rect class="track" x="130" y="291" width="690" height="34" rx="6"/><rect x="130" y="291" width="639.8" height="34" rx="6" fill="#1d4ed8"/><text class="value" x="779.8" y="314">204</text>
</svg>
